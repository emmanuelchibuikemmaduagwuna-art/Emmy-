<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Emmy's Global Virtual Numbers</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        nav {
            background: #111827;
            padding: 18px 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 8px;
            font-size: 15px;
        }

        .container {
            max-width: 460px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
        }

        .intro {
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 17px;
        }

        button:disabled {
            opacity: 0.6;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            line-height: 1.5;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #111827;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #111827;
            color: white;
        }
    </style>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="numbers.html">Numbers</a>
    <a href="signup.html">Sign Up</a>
</nav>

<div class="container">

    <h1>Welcome Back</h1>

    <p class="intro">
        Log in to your Emmy's Global Virtual Numbers account.
    </p>

    <form id="loginForm">

        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="you@gmail.com"
            autocomplete="email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Your password"
            autocomplete="current-password"
            required
        >

        <button type="submit" id="loginButton">
            Log In
        </button>

    </form>

    <div id="message"></div>

    <div class="links">
        <p>
            Don't have an account?
            <a href="signup.html">Create one</a>
        </p>
    </div>

</div>

<footer>
    © 2026 Emmy's Global Virtual Numbers
</footer>

<script>
    const SUPABASE_URL =
        "https://sdihzawapkzvuuulmxngt.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_W1ZXn-L36QoEaWJMoLTQiQ_XTLLitAD";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        message.textContent = "";
        button.disabled = true;
        button.textContent = "Logging in...";

        try {

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) {
                message.textContent = error.message;
                return;
            }

            window.location.href = "dashboard.html";

        } catch (error) {

            message.textContent =
                "Something went wrong. Please try again.";

        } finally {

            button.disabled = false;
            button.textContent = "Log In";

        }
    });
</script>

</body>
</html>
