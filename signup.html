<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Emmy's Global Virtual Numbers</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        nav {
            background: #111827;
            padding: 18px 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 8px;
            font-size: 15px;
        }

        .container {
            max-width: 460px;
            margin: 45px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            color: #666;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            line-height: 1.5;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #111827;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #111827;
            color: white;
        }
    </style>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="numbers.html">Numbers</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
</nav>

<div class="container">

    <h1>Create Your Account</h1>

    <p class="intro">
        Create an account with your email address to use
        Emmy's Global Virtual Numbers.
    </p>

    <form id="signupForm">

        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="you@gmail.com"
            autocomplete="email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="6"
            required
        >

        <label for="confirmPassword">Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Enter your password again"
            autocomplete="new-password"
            minlength="6"
            required
        >

        <button type="submit" id="signupButton">
            Create Account
        </button>

    </form>

    <div id="message"></div>

    <div class="login">
        Already have an account?
        <a href="login.html">Log in</a>
    </div>

</div>

<footer>
    © 2026 Emmy's Global Virtual Numbers
</footer>

<script>
    const SUPABASE_URL =
        "https://sdihzawapkzvuuulmxngt.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_W1ZXn-L36QoEaWJMoLTQiQ_XTLLitAD";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    const form = document.getElementById("signupForm");
    const message = document.getElementById("message");
    const button = document.getElementById("signupButton");

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        message.textContent = "";
        button.disabled = true;
        button.textContent = "Creating account...";

        if (password !== confirmPassword) {
            message.textContent =
                "The passwords do not match.";

            button.disabled = false;
            button.textContent = "Create Account";
            return;
        }

        if (password.length < 6) {
            message.textContent =
                "Your password must contain at least 6 characters.";

            button.disabled = false;
            button.textContent = "Create Account";
            return;
        }

        try {

            const { data, error } =
                await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

            if (error) {
                message.textContent = error.message;
                return;
            }

            message.textContent =
                "Account created successfully! Please check your email and click the verification link before logging in.";

            form.reset();

        } catch (error) {

            message.textContent =
                "Something went wrong. Please try again.";

        } finally {

            button.disabled = false;
            button.textContent = "Create Account";

        }
    });
</script>

</body>
</html>
