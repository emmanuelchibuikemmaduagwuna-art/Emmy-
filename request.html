<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request a Virtual Number - Emmy's Global Virtual Numbers</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        nav {
            background: #111827;
            padding: 18px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-size: 15px;
        }

        .form-container {
            max-width: 600px;
            margin: 45px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            color: #666;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .notice {
            margin-top: 20px;
            padding: 12px;
            background: #f0f4f8;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #111827;
            color: white;
        }

        @media (max-width: 600px) {
            .form-container {
                margin: 25px 15px;
                padding: 22px;
            }

            nav a {
                margin: 0 5px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="numbers.html">Numbers</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="form-container">

        <h1>Request a Virtual Number</h1>

        <p class="intro">
            Complete the form below and our team will review your request.
        </p>

        <form
            action="https://formspree.io/f/xbgrzlaw"
            method="POST"
        >

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Your full name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
            >

            <label for="country">Country</label>
            <select id="country" name="country" required>
                <option value="">Select a country</option>
                <option value="United States">🇺🇸 United States</option>
                <option value="United Kingdom">🇬🇧 United Kingdom</option>
                <option value="Nigeria">🇳🇬 Nigeria</option>
                <option value="Canada">🇨🇦 Canada</option>
                <option value="Germany">🇩🇪 Germany</option>
                <option value="Other">🌍 Other</option>
            </select>

            <label for="service">Service Type</label>
            <select id="service" name="service" required>
                <option value="">Select a service</option>
                <option value="Business communication">
                    Business communication
                </option>
                <option value="SMS communication">
                    SMS communication
                </option>
                <option value="Voice communication">
                    Voice communication
                </option>
                <option value="Other legitimate use">
                    Other legitimate use
                </option>
            </select>

            <label for="quantity">Number of Numbers</label>
            <select id="quantity" name="quantity" required>
                <option value="">Select quantity</option>
                <option value="1">1 number</option>
                <option value="2-5">2–5 numbers</option>
                <option value="6-10">6–10 numbers</option>
                <option value="10+">More than 10</option>
            </select>

            <label for="message">Additional Information</label>
            <textarea
                id="message"
                name="message"
                placeholder="Tell us what you need..."
            ></textarea>

            <button type="submit">
                Submit Request
            </button>

        </form>

        <div class="notice">
            Please use virtual numbers only for lawful purposes and in
            accordance with the terms of the services you use.
        </div>

    </div>

    <footer>
        © 2026 Emmy's Global Virtual Numbers
    </footer>

</body>
</html>
